<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>1+1 Proxy</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1020;color:#eef2ff;font:16px system-ui;display:grid;place-items:center;padding:22px}
main{width:min(720px,100%);background:#151d32;border:1px solid #2a3858;border-radius:22px;padding:30px;box-shadow:0 24px 70px #0008}
h1{font-size:42px;margin:0 0 4px;letter-spacing:-2px}.sub{color:#aab7d2;margin:0 0 25px}
form{display:flex;gap:10px;flex-wrap:wrap}input{flex:1;min-width:220px;padding:15px;border-radius:12px;border:1px solid #405071;background:#0c1427;color:white;font-size:16px}
button{padding:0 22px;border:0;border-radius:12px;background:#4778ff;color:white;font-weight:700;font-size:15px;cursor:pointer}
.note{font-size:13px;color:#aab7d2;line-height:1.6;margin-top:20px}.status{margin-top:14px;color:#9fc0ff;min-height:22px}
</style>
</head><body><main>
<h1>1+1</h1><p class="sub">Proxy web · Introduce una dirección</p>
<form id="go"><input id="address" type="text" placeholder="https://ejemplo.com" autocomplete="url" required><button>Abrir web ↗</button></form>
<div class="status" id="status"></div>
<p class="note">Pega una URL pública que tengas permiso para visitar. No introduzcas contraseñas ni datos privados. Algunas páginas bloquean proxies y pueden no funcionar.</p>
</main>
<script>
/* CAMBIA esta dirección por la URL real de tu Cloudflare Worker. */
const WORKER_URL = "https://TU-WORKER.TU-SUBDOMINIO.workers.dev";
const form=document.querySelector('#go'), input=document.querySelector('#address'), status=document.querySelector('#status');
form.addEventListener('submit',e=>{
 e.preventDefault();
 if(WORKER_URL.includes("TU-WORKER")){status.textContent="Falta configurar la dirección del servidor proxy en index.html.";return;}
 let raw=input.value.trim(); if(!/^https?:\/\//i.test(raw))raw='https://'+raw;
 try{
  const u=new URL(raw); if(!['http:','https:'].includes(u.protocol))throw Error();
  const key=prompt("Introduce la clave del proxy:"); if(!key)return;
  location.href=WORKER_URL.replace(/\/$/,"")+"/proxy?url="+encodeURIComponent(u.href)+"&key="+encodeURIComponent(key);
 }catch(_){status.textContent="Escribe una URL válida, por ejemplo https://example.com";}
});
</script></body></html>
